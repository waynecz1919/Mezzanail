<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -150 300 300" width="300" height="300" role="img" aria-label="Mezzanail 7th Anniversary, 2019 to 2026">
  <defs>
    <linearGradient id="mdGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1E2BC"/>
      <stop offset=".45" stop-color="#C9AE77"/>
      <stop offset=".7" stop-color="#B69B68"/>
      <stop offset="1" stop-color="#86703F"/>
    </linearGradient>
    <linearGradient id="mdGoldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EAC8"/>
      <stop offset=".55" stop-color="#E2CB95"/>
      <stop offset="1" stop-color="#B69B68"/>
    </linearGradient>
    <radialGradient id="mdInk" cx=".38" cy=".32" r=".85">
      <stop offset="0" stop-color="#4A4846"/>
      <stop offset=".6" stop-color="#2F2E2D"/>
      <stop offset="1" stop-color="#222120"/>
    </radialGradient>
    <path id="mdArc" d="M 0 -113 A 113 113 0 1 1 -0.01 -113"/>
    <g id="mdLeaf"><path d="M0 0 C 4 -5 4 -11 0 -15 C -4 -11 -4 -5 0 0 Z"/></g>
  </defs>

  <!-- outer gold bezel -->
  <circle r="148" fill="url(#mdGold)"/>
  <circle r="141" fill="url(#mdInk)"/>
  <circle r="136" fill="none" stroke="#C9AE77" stroke-width="1"/>
  <circle r="131" fill="none" stroke="#E2D3B0" stroke-width="1.6" stroke-dasharray="0.1 6.2" stroke-linecap="round"/>

  <!-- curved inscription -->
  <text font-size="11" letter-spacing="3.1" fill="#E2D3B0" style="font-family:var(--font-manrope),Poppins,Arial,sans-serif;font-weight:600">
    <textPath href="#mdArc" startOffset="0">MEZZANAIL NAIL STUDIO ✦ SEVENTH ANNIVERSARY ✦ 2019 · 2026 ✦</textPath>
  </text>

  <!-- inner disc -->
  <circle r="98" fill="url(#mdInk)" stroke="url(#mdGold)" stroke-width="2.5"/>
  <circle r="92" fill="none" stroke="rgba(226,211,176,.35)" stroke-width="1"/>

  <!-- laurel: left branch -->
  <g fill="#D6C08E">
    <g transform="rotate(238) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(251) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(264) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(277) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(290) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(303) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(244) translate(0 -66) rotate(30)"><use href="#mdLeaf"/></g>
    <g transform="rotate(257) translate(0 -66) rotate(30)"><use href="#mdLeaf"/></g>
    <g transform="rotate(270) translate(0 -66) rotate(30)"><use href="#mdLeaf"/></g>
    <g transform="rotate(283) translate(0 -66) rotate(30)"><use href="#mdLeaf"/></g>
    <g transform="rotate(296) translate(0 -66) rotate(30)"><use href="#mdLeaf"/></g>
  </g>
  <!-- laurel: right branch (mirror) -->
  <g fill="#D6C08E" transform="scale(-1 1)">
    <g transform="rotate(238) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(251) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(264) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(277) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(290) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(303) translate(0 -74) rotate(-60)"><use href="#mdLeaf"/></g>
    <g transform="rotate(244) translate(0 -66) rotate(30)"><use href="#mdLeaf"/></g>
    <g transform="rotate(257) translate(0 -66) rotate(30)"><use href="#mdLeaf"/></g>
    <g transform="rotate(270) translate(0 -66) rotate(30)"><use href="#mdLeaf"/></g>
    <g transform="rotate(283) translate(0 -66) rotate(30)"><use href="#mdLeaf"/></g>
    <g transform="rotate(296) translate(0 -66) rotate(30)"><use href="#mdLeaf"/></g>
  </g>

  <!-- sparkle crown -->
  <path d="M0 -76 l3.2 8 8 3.2 -8 3.2 -3.2 8 -3.2 -8 -8 -3.2 8 -3.2z" fill="#E2CB95"/>

  <!-- numeral -->
  <text x="-3" y="30" text-anchor="middle" font-size="104" fill="url(#mdGoldText)" style="font-family:var(--font-beauty),'Cormorant Garamond',Lora,Georgia,serif;font-weight:500">7</text>
  <text x="30" y="-12" font-size="24" fill="url(#mdGoldText)" style="font-family:var(--font-beauty),'Cormorant Garamond',Lora,Georgia,serif;font-weight:500;font-style:italic">th</text>

  <!-- ribbon label -->
  <line x1="-30" y1="48" x2="30" y2="48" stroke="#B69B68" stroke-width="1"/>
  <text y="64" text-anchor="middle" font-size="10" letter-spacing="2.6" fill="#E2D3B0" style="font-family:var(--font-manrope),Poppins,Arial,sans-serif;font-weight:600">ANNIVERSARY</text>
</svg>
